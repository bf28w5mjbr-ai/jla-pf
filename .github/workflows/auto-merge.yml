name: "Auto-merge PRs with label"

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge
        uses: pascalgn/automerge-action@v0.14.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: squash
          # Generic PR only; dependabot is handled in auto-approve-dependabot workflow.
          labels: 'automerge'
          allow_no_review: false
