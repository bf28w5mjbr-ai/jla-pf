name: "Auto-merge PRs with label"

# PR の作成・更新・ラベル変更では起動しない。自動マージ用トークンは渡さない。
on:
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Automerge stays disabled
        run: |
          {
            echo "### Automerge"
            echo "自動マージは無効です。GITHUB_TOKEN は渡していません。"
          } >> "$GITHUB_STEP_SUMMARY"
