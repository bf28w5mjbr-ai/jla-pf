# Capacitor の設定とネイティブプロジェクトが `cap sync` で壊れていないことを確認する。
# PR では重いため workflow_dispatch のみ（必要に応じて release ブランチに on.push を追加可）。

name: Capacitor sync verify

on:
  workflow_dispatch:

jobs:
  cap-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare webDir for Capacitor
        run: |
          mkdir -p out
          printf '%s\n' '<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>cap</title></head><body></body></html>' > out/index.html

      - name: Capacitor sync
        run: pnpm exec cap sync
