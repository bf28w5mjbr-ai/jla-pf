name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # next build は production 相当で AUTH_SECRET を要求する（本番値ではなくビルド通過用のダミー）
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migration gate
        run: node scripts/check-prisma-migration-consistency.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test --run
      - name: Build
        run: pnpm build
      - name: Verify PDF font output traces
        run: pnpm verify:pdf-font-nft
