name: "PR Status Notification"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR notification to Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "channel": "#dev-alerts",
              "text": "📝 New PR: ${{ github.event.pull_request.title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}*\n<${{ github.event.pull_request.html_url }}|Review PR>"
                  }
                }
              ]
            }
