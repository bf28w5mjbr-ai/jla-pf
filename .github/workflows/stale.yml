name: "Mark stale issues and PRs"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Run stale action
        uses: actions/stale@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: false
          days-before-stale: 60
          days-before-close: 7
          exempt-labels: |
            pinned
            security
