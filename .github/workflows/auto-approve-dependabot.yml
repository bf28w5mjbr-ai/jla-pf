name: "Auto-approve Dependabot"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto_approve:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Auto-approve
        uses: hmarr/auto-approve-action@v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
