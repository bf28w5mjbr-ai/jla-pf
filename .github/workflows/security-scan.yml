name: "Security Scanning"

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@v3.90.4
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
  
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint Security Plugin
        run: |
          pnpm lint
  
  dependency-scan:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
      # if では secrets コンテキストを使えないため job env 経由で有無だけ判定する（値はログに出さない）
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run npm audit
        run: pnpm audit --audit-level=high
      - name: Snyk Scan
        uses: snyk/actions/node@0.4.0
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          args: --severity-threshold=high
  
  docker-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t bluvium:latest .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: bluvium:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
