name: "Performance Monitoring"

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bluvium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bluvium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
      # job 内使い捨て Postgres のみ。本番・共有開発の秘密情報は使わない
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bluvium_ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/bluvium_ci
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure PostgREST roles on CI Postgres
        run: |
          pnpm exec prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply Prisma migrations to CI Postgres
        run: pnpm exec prisma migrate deploy
      - name: Build
        run: pnpm build
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./lhr.json', 'utf8'));
            const scores = results.categories;
            const comment = [
              '## Lighthouse Scores',
              '',
              '| Category | Score |',
              '| --- | --- |',
              `| Performance | ${(scores.performance.score * 100).toFixed(0)} |`,
              `| Accessibility | ${(scores.accessibility.score * 100).toFixed(0)} |`,
              `| Best Practices | ${(scores['best-practices'].score * 100).toFixed(0)} |`,
              `| SEO | ${(scores.seo.score * 100).toFixed(0)} |`,
              `| PWA | ${(scores.pwa?.score * 100 || 'N/A')} |`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
  
  bundle-size:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bluvium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bluvium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bluvium_ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/bluvium_ci
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure PostgREST roles on CI Postgres
        run: |
          pnpm exec prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply Prisma migrations to CI Postgres
        run: pnpm exec prisma migrate deploy
      - name: Build and analyze
        run: |
          pnpm build
          echo "Build size analysis:"
          du -sh .next/static
      - name: Check bundle size threshold
        run: |
          SIZE=$(du -sk .next/static | cut -f1)
          THRESHOLD=5000  # 5MB in KB
          if [ $SIZE -gt $THRESHOLD ]; then
            echo "Bundle size (${SIZE}KB) exceeds threshold (${THRESHOLD}KB)"
            exit 1
          fi
          echo "Bundle size OK: ${SIZE}KB"
