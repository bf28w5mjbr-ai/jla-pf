name: "Performance Monitoring"

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bluvium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bluvium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
      # job 内使い捨て Postgres のみ。本番・共有開発の秘密情報は使わない
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bluvium_ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/bluvium_ci
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure PostgREST roles on CI Postgres
        run: |
          pnpm exec prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply Prisma migrations to CI Postgres
        run: pnpm exec prisma migrate deploy
      - name: Build
        run: pnpm build
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: false
      - name: Write Lighthouse scores to job summary
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const dir = path.resolve(".lighthouseci");
          const manifestPath = path.join(dir, "manifest.json");
          if (!fs.existsSync(manifestPath)) {
            console.error(
              "LHCI did not write .lighthouseci/manifest.json. ./lhr.json is not an output of this action."
            );
            process.exit(1);
          }

          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const runs = Array.isArray(manifest) ? manifest : [];
          const selected = runs.find((run) => run && run.isRepresentativeRun) || runs[0];
          if (!selected || !selected.jsonPath) {
            console.error("manifest.json has no LHR jsonPath.");
            process.exit(1);
          }

          const lhrPath = path.resolve(selected.jsonPath);
          if (!fs.existsSync(lhrPath)) {
            console.error(`LHR file from manifest jsonPath was not found: ${selected.jsonPath}`);
            process.exit(1);
          }

          const lhr = JSON.parse(fs.readFileSync(lhrPath, "utf8"));
          const categories = lhr.categories || {};
          const order = ["performance", "accessibility", "best-practices", "seo", "pwa"];
          const lines = [
            "### Lighthouse",
            "",
            `URL: ${selected.url || lhr.finalUrl || ""}`,
            `LHR: ${path.relative(process.cwd(), lhrPath)}`,
            "",
            "| Category | Score |",
            "| --- | ---: |",
          ];
          for (const id of order) {
            const category = categories[id];
            if (!category) continue;
            const score =
              category.score == null ? "n/a" : String(Math.round(category.score * 100));
            lines.push(`| ${category.title || id} | ${score} |`);
          }
          const summary = `${lines.join("\n")}\n`;
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          }
          process.stdout.write(summary);
          NODE
  
  bundle-size:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bluvium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bluvium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-xx
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bluvium_ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/bluvium_ci
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure PostgREST roles on CI Postgres
        run: |
          pnpm exec prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply Prisma migrations to CI Postgres
        run: pnpm exec prisma migrate deploy
      - name: Build and analyze
        run: |
          pnpm build
          echo "Build size analysis:"
          du -sh .next/static
      - name: Check bundle size threshold
        run: |
          SIZE=$(du -sk .next/static | cut -f1)
          THRESHOLD=5000  # 5MB in KB
          if [ $SIZE -gt $THRESHOLD ]; then
            echo "Bundle size (${SIZE}KB) exceeds threshold (${THRESHOLD}KB)"
            exit 1
          fi
          echo "Bundle size OK: ${SIZE}KB"
